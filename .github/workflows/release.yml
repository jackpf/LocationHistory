name: Release

on:
  push:
    tags: [ "v*" ]

jobs:
  release-server-version:
    uses: ./.github/workflows/build-server.yml
    with:
      version: ${{ github.ref_name }}
      publish: true
    secrets: inherit

  release-foss-client:
    uses: ./.github/workflows/build-client.yml
    with:
      version: ${{ github.ref_name }}
      build_type: "release"
      flavor: "foss"
      publish: true
    secrets: inherit

  release-gms-client:
    uses: ./.github/workflows/build-client.yml
    with:
      version: ${{ github.ref_name }}
      build_type: "release"
      flavor: "gms"
      publish: true
    secrets: inherit

  release-ui-version:
    uses: ./.github/workflows/build-ui.yml
    with:
      version: ${{ github.ref_name }}
      publish: true
    secrets: inherit

  publish-release:
    needs:
      - release-server-version
      - release-foss-client
      - release-gms-client
      - release-ui-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-foss-release
          path: ./artifacts

      - uses: actions/download-artifact@v4
        with:
          name: app-gms-release
          path: ./artifacts

      - name: Version APKs
        run: |
          mv ./artifacts/app-foss-release.apk \
             ./artifacts/LocationHistory-foss-${{ github.ref_name }}.apk
          mv ./artifacts/app-gms-release.apk \
             ./artifacts/LocationHistory-gms-${{ github.ref_name }}.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*.apk
          generate_release_notes: true
