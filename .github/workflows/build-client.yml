name: Reusable Client Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_type:
        required: true
        type: string # 'debug' or 'release'
      flavor:
        required: false
        type: string
        default: 'foss' # 'foss' (UnifiedPush, F-Droid) or 'gms' (Firebase, Google Play)
      publish:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: sbt

      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 1.11.7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Shared
        working-directory: ./shared
        run: make compile publish

      - name: Write google-services.json (GMS only)
        if: inputs.flavor == 'gms'
        working-directory: ./client
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app/src/gms
          echo "$GOOGLE_SERVICES_JSON" > app/src/gms/google-services.json

      - name: Lint
        working-directory: ./client
        run: make lint-${{ inputs.flavor }}

      - name: Test
        working-directory: ./client
        run: make test-${{ inputs.flavor }}

      - name: Decode Keystore
        if: inputs.publish
        working-directory: ./client
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Debug
        if: inputs.build_type == 'debug'
        working-directory: ./client
        run: make VERSION="${{ inputs.version }}" build-${{ inputs.flavor }}-debug

      - name: Build Release
        if: inputs.build_type == 'release'
        working-directory: ./client
        run: make VERSION="${{ inputs.version }}" build-${{ inputs.flavor }}-release
        env:
          KEYSTORE_PATH: '../release.jks'
          KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          KEY_ALIAS: '${{ secrets.ANDROID_KEYSTORE_ALIAS }}'

      - name: Upload artifact
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.flavor }}-${{ inputs.build_type }}
          path: client/app/build/outputs/apk/${{ inputs.flavor }}/${{ inputs.build_type }}/*.apk
